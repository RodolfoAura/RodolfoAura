<g font-family="monospace"><text x="70" y="69" font-size="15" fill="#00f0ff" letter-spacing="4">[ SYSTEM ONLINE // BRAZIL ]</text><text x="70" y="148" font-size="66" font-weight="900" fill="#fcee09" letter-spacing="3" filter="url(#glow)">RODOLFO AURA</text><text x="73" y="191" font-size="24" fill="#f5f7ff" letter-spacing="4">TECH SUPPORT / SOFTWARE / GAME DEV</text><text x="73" y="239" font-size="18" fill="#00f0ff">BUILDING REAL-WORLD SYSTEMS_ <animate attributeName="opacity" values="1;1;.2;1" dur="1.3s" repeatCount="indefinite"/></text><text x="74" y="282" font-size="12" fill="#829aad" letter-spacing="2">NETWORKS  //  CLOUDFLARE  //  WEB APPS  //  INTERACTIVE WORLDS</text><text x="945" y="65" font-size="11" fill="#fcee09">NIGHT CITY // 2077</text></g>
